<html lang="en">
  <head>
    <script>
      // L'AudioWorklet n'existe qu'en HTTPS : sans lui, pas de son. Le développement local n'est pas concerné.
      if (location.protocol === 'http:' && location.hostname !== 'localhost' && !/^[\d.]+$/.test(location.hostname)) {
        location.replace('https:' + location.href.slice(5));
      }
    </script>
